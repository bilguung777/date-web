<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Надтай болзооны явах уу? 🌹</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffeef8 0%, #fff0fb 40%, #e8f4ff 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden; position: relative; user-select: none;
  }
  .petal { position: fixed; animation: falling linear infinite; pointer-events: none; opacity: 0.7; }
  @keyframes falling {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }
  .card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 44px 32px 36px;
    width: min(340px, 88vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,100,170,0.2), 0 4px 20px rgba(0,0,0,0.05);
    border: 1.5px solid rgba(255,180,210,0.4);
    position: relative; z-index: 10;
    animation: cardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardPop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .avatar-wrap {
    width: 90px; height: 90px;
    border-radius: 50%;
    margin: 0 auto 20px;
    box-shadow: 0 6px 20px rgba(255,120,180,0.45);
    animation: bounce 2s ease-in-out infinite;
    overflow: hidden;
    border: 3px solid #ffaad4;
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .deco-top { position:absolute; top:-10px; right:-10px; font-size:1.5rem; animation: spin 4s linear infinite; }
  .deco-left { position:absolute; top:20px; left:-8px; font-size:1.2rem; animation: spin 6s linear infinite reverse; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .question { font-size: 1.35rem; font-weight: 900; color: #c0366a; margin-bottom: 24px; line-height: 1.5; }
  .btn-yes {
    display: block; width: 100%; padding: 16px;
    background: linear-gradient(135deg, #ff5fa0, #ff3d8b);
    color: white; border: none; border-radius: 50px;
    font-size: 1.1rem; font-weight: 900; font-family: 'Nunito', sans-serif;
    cursor: pointer; margin-bottom: 20px; letter-spacing: 2px;
    box-shadow: 0 6px 20px rgba(255,60,140,0.4);
    -webkit-tap-highlight-color: transparent; transition: transform 0.15s;
  }
  .btn-yes:active { transform: scale(0.97); }
  .no-area { position: relative; width: 100%; height: 60px; }
  .btn-no {
    position: absolute; padding: 11px 24px;
    background: rgba(210,210,230,0.35); color: #999;
    border: 1.5px solid rgba(200,200,220,0.5); border-radius: 50px;
    font-size: 0.95rem; font-weight: 700; font-family: 'Nunito', sans-serif;
    cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: left 0.15s cubic-bezier(0.22,1,0.36,1), top 0.15s cubic-bezier(0.22,1,0.36,1);
  }
  .hint { font-size: 0.75rem; color: #cca0b8; margin-top: 10px; font-style: italic; min-height: 18px; }
  .success-screen { display: none; animation: cardPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
  .success-screen.show { display: block; }
  .main-content.hide { display: none; }
  .success-emoji { font-size: 4rem; display: block; margin-bottom: 16px; animation: bounce 1s ease-in-out infinite; }
  .success-title { font-size: 1.5rem; font-weight: 900; color: #d63a7a; margin-bottom: 10px; }
  .success-sub { font-size: 0.95rem; color: #c085a8; line-height: 1.6; }
  .hearts-burst { font-size: 1.6rem; letter-spacing: 4px; margin-top: 16px; animation: pulse 0.8s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }
</style>
</head>

    "Надад хариулах хэрэгтэй шүү 😅",
    "ТИЙМ дарчих л даа...",
    "Тийм гэх нь зөв шийдвэр 😏",
    "Хэзээ ч дарагдахгүй тэр товч 🙅",
    "Зугтаж чадахгүй ш дээ 😈",
  ];
  let fleeCount = 0;
  function flee() {
    fleeCount++;
    hint.textContent = messages[Math.min(fleeCount, messages.length - 1)];
    const areaW = noArea.offsetWidth, areaH = noArea.offsetHeight;
    const btnW = btnNo.offsetWidth, btnH = btnNo.offsetHeight;
    const curL = parseFloat(btnNo.style.left) || (areaW/2 - btnW/2);
    const curT = parseFloat(btnNo.style.top) || 0;
    let x, y, tries = 0;
    do {
      x = Math.random() * (areaW - btnW);
      y = Math.random() * (areaH - btnH);
      tries++;
    } while (tries < 20 && Math.abs(x - curL) < btnW && Math.abs(y - curT) < btnH);
    btnNo.style.left = x + 'px';
    btnNo.style.top = y + 'px';
    if (fleeCount <= 6) btnYes.style.transform = 'scale(' + (1 + fleeCount * 0.04) + ')';
  }
  btnNo.addEventListener('touchstart', function(e) { e.preventDefault(); flee(); }, { passive: false });
  btnNo.addEventListener('mouseenter', flee);
  btnYes.addEventListener('click', function() {
    document.getElementById('mainContent').classList.add('hide');
    document.getElementById('successScreen').classList.add('show');
    for (let i = 0; i < 14; i++) {
      const h = document.createElement('div');
      h.style.cssText = 'position:fixed;font-size:' + (1+Math.random()*1.5) + 'rem;left:' + (Math.random()*90) + 'vw;top:' + (Math.random()*80) + 'vh;pointer-events:none;animation:falling ' + (2+Math.random()*3) + 's linear forwards;z-index:999';
      h.textContent = ['🌹','💗','💕','💓','🌹'][Math.floor(Math.random()*5)];
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5000);
    }
  });
  window.addEventListener('load', function() {
    const areaW = noArea.offsetWidth, btnW = btnNo.offsetWidth;
    btnNo.style.left = (areaW/2 - btnW/2) + 'px';
    btnNo.style.top = '8px';
    btnNo.style.transition = 'none';
    setTimeout(() => { btnNo.style.transition = 'left 0.15s cubic-bezier(0.22,1,0.36,1), top 0.15s cubic-bezier(0.22,1,0.36,1)'; }, 100);
  });
</script>
</body>
</html>
